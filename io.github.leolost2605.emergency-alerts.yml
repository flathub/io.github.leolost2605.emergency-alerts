app-id: io.github.leolost2605.emergency-alerts

runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk

command: io.github.leolost2605.emergency-alerts

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=dri

cleanup:
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/vala
  - '*.la'
  - '*.a'

modules:
  - name: sassc
    cleanup:
      - '*'
    sources:
      - type: git
        url: https://github.com/sass/sassc.git
        tag: 3.6.2
        commit: 66f0ef37e7f0ad3a65d2f481eff09d09408f42d0

      - type: script
        dest-filename: autogen.sh
        commands:
          - autoreconf -si
    modules:
      - name: libsass
        cleanup:
          - '*'
        sources:
          - type: git
            url: https://github.com/sass/libsass.git
            tag: 3.6.6
            commit: 7037f03fabeb2b18b5efa84403f5a6d7a990f460
          - type: script
            dest-filename: autogen.sh
            commands:
              - autoreconf -si

  - name: granite-7
    buildsystem: meson
    config-opts:
      - -Ddemo=false
    sources:
      - type: git
        url: https://github.com/elementary/granite.git
        tag: 7.6.0
        commit: 065ba1f245b60ef867a6ca145e0891cf84eddcc7

  - name: libshumate
    buildsystem: meson
    config-opts:
      - -Dgtk_doc=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libshumate/1.7/libshumate-1.7.0.tar.xz
        sha256: 3896cc4b6a7bf83141c27df23ce48cdd68467603bc6b764960307cdcbbef80e5
        x-checker-data:
          type: gnome
          name: libshumate
    modules:
      - name: protobuf-c
        buildsystem: autotools
        config-opts:
          - --disable-protoc
        sources:
          - type: git
            url: https://github.com/protobuf-c/protobuf-c.git
            tag: v1.5.2
            commit: 4719fdd7760624388c2c5b9d6759eb6a47490626
            x-checker-data:
              type: git
              tag-pattern: ^v([\d.]+)$

  - name: emergency-alerts
    buildsystem: meson
    config-opts:
      - -Dadwaita=true
    sources:
      - type: git
        url: https://github.com/leolost2605/emergency-alerts.git
        tag: '2.1.0'
        commit: 55fd65f3d08d3be09d1930cd87922effeea374e8
