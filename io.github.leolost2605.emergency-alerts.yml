app-id: io.github.leolost2605.emergency-alerts

runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk

command: io.github.leolost2605.emergency-alerts

finish-args:
  - '--share=ipc'
  - '--socket=fallback-x11'
  - '--socket=wayland'
  - '--share=network'
  - '--device=dri'

modules:
  - name: sassc
    cleanup:
      - '*'
    sources:
      - type: git
        url: https://github.com/sass/sassc.git
        tag: '3.6.2'

      - type: script
        dest-filename: "autogen.sh"
        commands:
          - autoreconf -si
    modules:
      - name: libsass
        cleanup:
          - '*'
        sources:
          - type: git
            url: https://github.com/sass/libsass.git
            tag: '3.6.5'
          - type: script
            dest-filename: "autogen.sh"
            commands:
              - autoreconf -si

  - name: granite-7
    buildsystem: meson
    config-opts:
      - -Ddemo=false
    sources:
      - type: git
        url: https://github.com/elementary/granite.git
        tag: '7.6.0'
        commit: 065ba1f245b60ef867a6ca145e0891cf84eddcc7

  - name: libportal
    buildsystem: meson
    config-opts:
      - -Dbackend-gtk3=disabled
      - -Dbackend-qt5=disabled
      - -Dbackend-qt6=disabled
      - -Ddocs=false
      - -Dtests=false
    sources:
      - type: git
        url: https://github.com/flatpak/libportal.git
        tag: '0.9.0'

  - name: libshumate
    buildsystem: meson
    config-opts:
      - -Dgtk_doc=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libshumate/1.7/libshumate-1.7.0.tar.xz
        sha256: 3896cc4b6a7bf83141c27df23ce48cdd68467603bc6b764960307cdcbbef80e5
        x-checker-data:
          type: gnome
          name: libshumate
    modules:
      - name: protobuf-c
        buildsystem: autotools
        config-opts:
          - --disable-protoc
        sources:
          - type: git
            url: https://github.com/protobuf-c/protobuf-c.git
            tag: v1.5.2
            commit: 4719fdd7760624388c2c5b9d6759eb6a47490626
            x-checker-data:
              type: git
              tag-pattern: ^v([\d.]+)$

  - name: emergency-alerts
    buildsystem: meson
    config-opts:
      - -Dadwaita=true
    sources:
      - type: git
        url: https://github.com/leolost2605/emergency-alerts.git
        tag: '2.0.0'
        commit: 122bc7ad968c36faa53886520bc53b05d037acee
